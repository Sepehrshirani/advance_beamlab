[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advance_beamlab"
version = "1.0"
description = "Advanced minimum-variance beamformers for MEG/EEG, compatible with MNE-Python"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = ["MEG", "EEG", "beamformer", "MCMV", "source localization", "MNE"]
authors = [
    { name = "Sepehr Shirani", email = "sepehrshirani@gmail.com" },
    { name = "Muzhi Wang" },
]
# An `authors` entry carries a single address, so the institutional one is given
# here; both end up in the distribution metadata.
maintainers = [{ name = "Sepehr Shirani", email = "s.shirani@ucl.ac.uk" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.25",
    "scipy>=1.11",
    # The MNE APIs used here (``_reg_pinv``, ``_compute_beamformer``,
    # ``compute_whitener``, ``Beamformer``, ``_get_src_type``, ``_get_vertno``)
    # are unchanged back to 1.8, but 1.10 is the floor actually exercised in CI
    # and is the first release whose ``Covariance._get_square`` and per-type rank
    # handling this package relies on. Do not lower it without adding a CI job.
    "mne>=1.10",
    "mne-connectivity>=0.5",
]

[project.optional-dependencies]
# The New York Head finite element model is a MATLAB v7.3 (HDF5) file, which
# scipy.io.loadmat cannot read, and it is fetched on demand rather than shipped
# (its licence forbids redistribution). Both dependencies are therefore optional
# and imported lazily: everything except ``read_ny_head_forward`` works without
# them. ``pooch`` already comes with MNE, so in practice only h5py is extra.
fem = ["h5py>=3.0", "pooch>=1.5"]
test = ["pytest>=8.0", "pytest-cov", "advance_beamlab[fem]"]
doc = [
    "sphinx",
    "sphinx-gallery",
    "myst-parser",
    "numpydoc",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "sphinx-design",
    "matplotlib",
    # The cortical-surface figures in the gallery need a working 3-D stack.
    # ``pyvistaqt`` is only a Qt wrapper, so a Qt binding has to be requested
    # explicitly or the backend silently fails to load and the brain figures
    # disappear from the build.
    "pyvista>=0.44",
    "pyvistaqt",
    "PyQt6",
    # The finite-element example reads the New York Head model, so the doc build
    # needs the HDF5 reader too. Fetching it only needs pooch (which arrives with
    # MNE), which is why the gallery got as far as downloading the model and then
    # failed on the read.
    "advance_beamlab[fem]",
    # MNE defers these: they are optional for it, but the gallery uses the parts
    # that need them. nibabel reads the FreeSurfer surfaces behind
    # ``make_bem_model``, ``setup_source_space`` and the cortical-surface plots;
    # without it the examples fail only at run time, which is why the gallery
    # and not the test suite is what caught it.
    "nibabel",
]
dev = ["advance_beamlab[test,doc]", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Sepehrshirani/advance_beamlab"
"Source Code" = "https://github.com/Sepehrshirani/advance_beamlab"

[tool.hatch.build.targets.wheel]
packages = ["src/advance_beamlab"]

# Linting + formatting configured to mirror MNE-Python's conventions, so that
# upstreamed files pass the MNE CI checks unchanged.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "D", "I", "UP", "B"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]
"examples/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["src/advance_beamlab/tests"]