name: deploy docs

# Build the documentation -- gallery and all -- and publish it to the
# advance_beamlab-docs repository, which serves
# https://sepehrshirani.github.io/advance_beamlab-docs/ from its gh-pages branch.
#
# This exists because the site was previously built by hand and pushed
# occasionally, so it drifted a month behind the code. Publishing from CI on
# every push to main means the site cannot disagree with the package again.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  # Queue, do not cancel. A full build takes about twenty minutes, so with
  # cancel-in-progress a run of pushes closer together than that cancels each
  # other in turn and nothing is ever published: four consecutive pushes once
  # left the site a day stale while every run showed as started. Queueing costs
  # a few idle minutes and guarantees the last push reaches the site.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Eighteen minutes in practice. A ceiling matters here because a step that
    # hangs rather than fails is indistinguishable from a slow one unless
    # somebody is watching the individual steps, and this job publishes: a
    # wedged run leaves the site silently stale. One sat for 2 h 43 m.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up a headless display for PyVista/Qt
        # The maintained action from the PyVista organisation, which is what
        # MNE-Python itself uses to build its documentation. It configures Xvfb,
        # Mesa and the Qt environment together; a hand-rolled apt list plus
        # ``xvfb-run`` did not give VTK a usable GLX visual and every
        # cortical-surface figure failed with RenderWindowUnavailable.
        uses: pyvista/setup-headless-display-action@v4
        # Seconds when it works, three minutes at worst. This is the step
        # that hung, so it gets a ceiling of its own rather than relying on
        # the job's.
        timeout-minutes: 10
        with:
          qt: true

      - name: Install the package with doc extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[doc]"

      - name: Cache the head models and datasets
        uses: actions/cache@v4
        with:
          # The MNE sample dataset, fsaverage, and the 678 MB New York Head FEM
          # model. All three live under the MNE data roots and are fetched once;
          # without this the gallery would re-download about 1.5 GB per build.
          path: |
            ~/mne_data
            ~/freesurfer/subjects
          key: mne-data-${{ runner.os }}-v2

      - name: Fetch the datasets and head models
        run: |
          python -c "import mne; mne.datasets.sample.data_path()"
          python -c "import mne; mne.datasets.fetch_fsaverage()"
          python -c "from advance_beamlab import fetch_ny_head; fetch_ny_head()"

      - name: Build the documentation
        # BEAMLAB_REQUIRE_3D makes a missing or broken 3-D backend fail the build
        # rather than silently publishing a gallery with its brain figures gone.
        env:
          MNE_3D_OPTION_ANTIALIAS: "false"
        run: |
          python -m sphinx -b html doc doc/_build/html --keep-going

      - name: Strip the Sphinx build cache
        # ``.doctrees`` is the incremental-build cache, not part of the site. It
        # was previously committed and accounted for 15 MB of a 40 MB repository.
        run: |
          rm -rf doc/_build/html/.doctrees
          touch doc/_build/html/.nojekyll

      - name: Publish to advance_beamlab-docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: Sepehrshirani/advance_beamlab-docs
          publish_branch: gh-pages
          publish_dir: doc/_build/html
          force_orphan: true
          commit_message: "Documentation for ${{ github.sha }}"

      - name: Require the gallery figures to have rendered
        # Deliberately *after* publishing, and it fails rather than warns. Put
        # before, a blank-figure regression would block the publish and leave the
        # site stale; put after, the site is always current and the regression
        # still turns the run red. This matters on main specifically: the strict
        # gallery job in the test workflow only runs on pull requests, so without
        # this a direct push could quietly republish blank figures -- which is
        # exactly what happened once already.
        run: python tools/check_gallery_images.py doc/_build/html
