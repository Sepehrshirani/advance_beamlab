name: test

# Run the test suite, the linter and the documentation build on pushes and pull
# requests to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .

  test:
    name: pytest (py${{ matrix.python-version }}, mne ${{ matrix.mne }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Span the supported range declared in pyproject (requires-python).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        mne: ["latest"]
        include:
          # Pin the *declared minimum* MNE so the ``mne>=1.10`` floor in
          # pyproject.toml is actually exercised rather than merely asserted.
          - python-version: "3.10"
            mne: "1.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Pin the minimum supported MNE
        if: matrix.mne != 'latest'
        run: python -m pip install "mne==${{ matrix.mne }}.*"
      - name: Show versions
        run: python -c "import mne, numpy, scipy; print(mne.__version__, numpy.__version__, scipy.__version__)"
      - name: Run tests
        run: pytest -q --cov=advance_beamlab --cov-report=term-missing

  test-with-dataset:
    # The integration tests in ``test_integration_sample.py`` skip themselves
    # when the ``sample`` dataset is absent, which on a bare runner means they
    # never run at all. Fetch and cache the dataset on one job so the real-data
    # pipeline is genuinely covered.
    name: pytest (sample dataset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Cache the MNE sample dataset
        uses: actions/cache@v4
        with:
          path: ~/mne_data
          key: mne-sample-${{ runner.os }}-v1
      - name: Fetch the sample dataset
        run: python -c "import mne; mne.datasets.sample.data_path()"
      - name: Run the integration tests
        run: pytest -q src/advance_beamlab/tests/test_integration_sample.py

  doc:
    # Fast pass: no gallery execution, so this fails quickly on a broken
    # cross-reference or a malformed docstring rather than after several minutes
    # of running examples. ``-W`` makes warnings errors, ``-n`` checks every
    # cross-reference target.
    name: docs (no gallery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with doc extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[doc]"
      - name: Build the documentation
        run: |
          python -m sphinx -b html doc doc/_build/html -W -n --keep-going \
            -D plot_gallery=0 -j auto

  doc-gallery:
    # Full build: runs every example and captures its figures, including the
    # cortical-surface plots. Those are the only images in the gallery that show
    # a source estimate on a brain, and this job fails if they go missing --
    # they disappeared once already when the headless display was misconfigured,
    # and a gallery that quietly loses them looks fine until someone opens it.
    name: docs (full gallery)
    # Pull requests only: pushes to main are covered by the docs-deploy workflow,
    # which performs the same build and then publishes it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up a headless display for PyVista/Qt
        # The maintained action from the PyVista organisation, which is what
        # MNE-Python itself uses to build its documentation. It configures Xvfb,
        # Mesa and the Qt environment together; a hand-rolled apt list plus
        # ``xvfb-run`` did not give VTK a usable GLX visual and every
        # cortical-surface figure failed with RenderWindowUnavailable.
        uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
      - name: Install package with doc extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[doc]"
      - name: Cache the MNE sample dataset
        uses: actions/cache@v4
        with:
          path: ~/mne_data
          key: mne-sample-${{ runner.os }}-v1
      - name: Fetch the sample dataset
        run: python -c "import mne; mne.datasets.sample.data_path()"
      - name: Build the documentation with the gallery
        env:
          MNE_3D_OPTION_ANTIALIAS: "false"
        run: |
          python -m sphinx -b html doc doc/_build/html --keep-going
      - name: Require the cortical-surface figures
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          imgs = sorted(Path("doc/_build/html/_images").glob("sphx_glr_*.png"))
          big = [p for p in imgs if p.stat().st_size > 90_000]
          print(f"gallery images: {len(imgs)}; cortical-surface renders: {len(big)}")
          if not big:
              sys.exit(
                  "no cortical-surface figures were captured -- the 3-D backend "
                  "did not render. Check the headless display setup."
              )
          PY
      - name: Upload the built documentation
        uses: actions/upload-artifact@v4
        with:
          name: html-doc
          path: doc/_build/html
