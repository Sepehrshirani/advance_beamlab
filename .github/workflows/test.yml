name: test

# Run the test suite, the linter and the documentation build on pushes and pull
# requests to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    # Well under a minute in practice; the ceiling is only there so a wedged
    # runner fails instead of idling.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned deliberately. An unpinned ruff means any release can change the
        # formatting rules and fail an unrelated pull request: 0.16 began
        # formatting Python code blocks inside Markdown, which reformatted
        # README.md and broke a build that had not touched it. Bump this
        # explicitly, with the reformatting in the same commit.
        run: python -m pip install --upgrade pip "ruff==0.16.2"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .

  test:
    name: pytest (py${{ matrix.python-version }}, mne ${{ matrix.mne }})
    runs-on: ubuntu-latest
    # Five to nine minutes per matrix entry.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Span the supported range declared in pyproject (requires-python).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        mne: ["latest"]
        include:
          # Pin the *declared minimum* MNE so the ``mne>=1.10`` floor in
          # pyproject.toml is actually exercised rather than merely asserted.
          - python-version: "3.10"
            mne: "1.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Pin the minimum supported MNE
        if: matrix.mne != 'latest'
        run: python -m pip install "mne==${{ matrix.mne }}.*"
      - name: Show versions
        run: python -c "import mne, numpy, scipy; print(mne.__version__, numpy.__version__, scipy.__version__)"
      - name: Run tests
        run: pytest -q --cov=advance_beamlab --cov-report=term-missing

  test-with-dataset:
    # Tests that need real data skip themselves when it is absent, which on a
    # bare runner means they never run at all. Fetch and cache the datasets on
    # one job and run the full suite there, so every data-gated path is covered
    # somewhere.
    name: pytest (sample dataset)
    runs-on: ubuntu-latest
    # Twenty-six minutes before this job ran the whole suite, so the ceiling
    # leaves room for it to grow.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Cache the head models and datasets
        uses: actions/cache@v4
        with:
          # The MNE sample dataset, fsaverage, and the 678 MB New York Head FEM
          # model. All three live under the MNE data roots and are fetched once;
          # without this the gallery would re-download about 1.5 GB per build.
          path: |
            ~/mne_data
            ~/freesurfer/subjects
          key: mne-data-${{ runner.os }}-v2
      - name: Fetch the datasets and head models
        run: |
          python -c "import mne; mne.datasets.sample.data_path()"
          python -c "import mne; mne.datasets.fetch_fsaverage()"
          python -c "from advance_beamlab import fetch_ny_head; fetch_ny_head()"
      - name: Run the whole suite, with the data present
        # The WHOLE suite, not a list of files. Tests gate themselves on the data
        # they need, and on a bare runner every one of them skips, so this job is
        # the only place they are genuinely exercised. Naming the files here meant
        # the list had to be kept in step with where the gated tests happened to
        # live, and it was not: two in test_abmc.py and three in
        # test_recipsiicos.py gated themselves on the sample dataset, were skipped
        # by every matrix job for want of it, and were not in the list either, so
        # they had never run anywhere. Running everything costs a few minutes on a
        # job already dominated by fetching 1.5 GB, and cannot fall out of step.
        run: pytest -q src/advance_beamlab

  doc:
    # Fast pass: no gallery execution, so this fails quickly on a broken
    # cross-reference or a malformed docstring rather than after several minutes
    # of running examples. ``-W`` makes warnings errors, ``-n`` checks every
    # cross-reference target.
    name: docs (no gallery)
    runs-on: ubuntu-latest
    # Under a minute: no gallery is executed here.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with doc extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[doc]"
      - name: Build the documentation
        # No gallery here, so nothing is rendered and the runner has neither a
        # display nor the Qt/EGL libraries. Importing pyvistaqt anyway fails with
        # ``ImportError: libEGL.so.1``, so tell conf.py to skip the 3-D stack
        # entirely; the full-gallery job below is what exercises it.
        env:
          BEAMLAB_NO_3D: "1"
        run: |
          python -m sphinx -b html doc doc/_build/html -W -n --keep-going \
            -D plot_gallery=0 -j auto

  doc-gallery:
    # Full build: runs every example and captures its figures, including the
    # cortical-surface plots. Those are the only images in the gallery that show
    # a source estimate on a brain, and this job fails if they go missing --
    # they disappeared once already when the headless display was misconfigured,
    # and a gallery that quietly loses them looks fine until someone opens it.
    name: docs (full gallery)
    # Pull requests only: pushes to main are covered by the docs-deploy workflow,
    # which performs the same build and then publishes it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Around twenty minutes, the gallery being executed in full.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up a headless display for PyVista/Qt
        # The maintained action from the PyVista organisation, which is what
        # MNE-Python itself uses to build its documentation. It configures Xvfb,
        # Mesa and the Qt environment together; a hand-rolled apt list plus
        # ``xvfb-run`` did not give VTK a usable GLX visual and every
        # cortical-surface figure failed with RenderWindowUnavailable.
        uses: pyvista/setup-headless-display-action@v4
        # Seconds when it works, three minutes at worst. This is the step
        # that hung, so it gets a ceiling of its own rather than relying on
        # the job's.
        timeout-minutes: 10
        with:
          qt: true
      - name: Install package with doc extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[doc]"
      - name: Cache the head models and datasets
        uses: actions/cache@v4
        with:
          # The MNE sample dataset, fsaverage, and the 678 MB New York Head FEM
          # model. All three live under the MNE data roots and are fetched once;
          # without this the gallery would re-download about 1.5 GB per build.
          path: |
            ~/mne_data
            ~/freesurfer/subjects
          key: mne-data-${{ runner.os }}-v2
      - name: Fetch the datasets and head models
        run: |
          python -c "import mne; mne.datasets.sample.data_path()"
          python -c "import mne; mne.datasets.fetch_fsaverage()"
          python -c "from advance_beamlab import fetch_ny_head; fetch_ny_head()"
      - name: Build the documentation with the gallery
        env:
          MNE_3D_OPTION_ANTIALIAS: "false"
        run: |
          python -m sphinx -b html doc doc/_build/html --keep-going
      - name: Require the cortical-surface figures to have rendered
        # Not a size check: a detailed matplotlib figure is bigger than a brain
        # screenshot, so "there are large images" proves nothing. This fails if
        # any figure is a blank canvas, which is how a misconfigured 3-D backend
        # actually manifests -- it does not raise, it publishes an empty PNG.
        run: python tools/check_gallery_images.py doc/_build/html
      - name: Upload the built documentation
        uses: actions/upload-artifact@v4
        with:
          name: html-doc
          path: doc/_build/html
