name: test

# Run the test suite, the linter and the documentation build on pushes and pull
# requests to the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .

  test:
    name: pytest (py${{ matrix.python-version }}, mne ${{ matrix.mne }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Span the supported range declared in pyproject (requires-python).
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        mne: ["latest"]
        include:
          # Pin the *declared minimum* MNE so the ``mne>=1.10`` floor in
          # pyproject.toml is actually exercised rather than merely asserted.
          - python-version: "3.10"
            mne: "1.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Pin the minimum supported MNE
        if: matrix.mne != 'latest'
        run: python -m pip install "mne==${{ matrix.mne }}.*"
      - name: Show versions
        run: python -c "import mne, numpy, scipy; print(mne.__version__, numpy.__version__, scipy.__version__)"
      - name: Run tests
        run: pytest -q --cov=advance_beamlab --cov-report=term-missing

  test-with-dataset:
    # The integration tests in ``test_integration_sample.py`` skip themselves
    # when the ``sample`` dataset is absent, which on a bare runner means they
    # never run at all. Fetch and cache the dataset on one job so the real-data
    # pipeline is genuinely covered.
    name: pytest (sample dataset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Cache the MNE sample dataset
        uses: actions/cache@v4
        with:
          path: ~/mne_data
          key: mne-sample-${{ runner.os }}-v1
      - name: Fetch the sample dataset
        run: python -c "import mne; mne.datasets.sample.data_path()"
      - name: Run the integration tests
        run: pytest -q src/advance_beamlab/tests/test_integration_sample.py

  doc:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with doc extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[doc]"
      - name: Build the documentation
        # ``-W`` turns Sphinx warnings into errors so broken cross-references and
        # malformed docstrings fail the build. The gallery is not executed here
        # (it needs the dataset and several minutes); ``test-with-dataset``
        # covers the code the gallery exercises.
        run: |
          python -m sphinx -b html doc doc/_build/html -W --keep-going \
            -D plot_gallery=0 -j auto
